# CI gate: the frontend build, the parse-tests harness, and the site locks.
#
# release.yml only builds and packages — without this gate a type error or a
# broken provider parser could ship in a tagged release. The site tests also
# run in site-deploy.yml, but that workflow is path-filtered to `site/**`:
# src-only pushes — exactly the ones that stale the demo bundle — never
# reach it, so they are gated here unconditionally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual dispatch lets a release session pre-flight the exact working tree
  # on a probe branch (git stash create -> push that SHA -> gh workflow run
  # --ref ci-probe) while it is still splitting commits, so environment-only
  # test failures surface before main is pushed. See temp/wrapup-070 for the
  # 0.7.0 post-mortem this was added for.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Changed-lines architecture gate (#65): shared files may not gain a new
  # provider literal without delegating to providers::<family>:: or carrying
  # an explicit `// provider-specific: <reason>` marker.
  family-gatekeeper:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/family-gatekeeper.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # tsc --noEmit + vite build (the same command the release uses).
      - run: pnpm run build

  # The harness compiles the real src-tauri sources via #[path] against a
  # Tauri stub; it is developed and verified on Windows, which is also the
  # target platform, so the gate runs there rather than on Linux.
  parse-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parse-tests
      - run: cargo test
        working-directory: parse-tests

  # src-tauri's own #[test]s — 836 across the tree, including the lib.rs
  # snapshot/purge data-loss guards — never ran anywhere: the harness
  # covers the pure modules, but lib.rs needs the real Tauri runtime and
  # this dev machine's GNU toolchain can't link a test exe. MSVC on CI
  # links the release build fine (release.yml proves it), so this job is
  # what keeps the remaining tests alive.
  src-tauri-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test
        working-directory: src-tauri

  # Zero-dependency invariant locks: i18n pairing, asset existence, demo
  # provenance hashes, hero numbers. No npm install — they only read tracked
  # files, which is what makes them cheap enough for every push and PR.
  # The app-side i18n pairing test rides along here for the same reason.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test site/*.test.mjs tests/i18n-pairing.test.mjs
      - run: node site/scripts/check-skin-packs.mjs
      # The site's version and provider count are generated, never typed.
      - run: node site/scripts/sync-site-version.mjs --check
