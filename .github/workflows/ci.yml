# CI gate: the frontend build, the parse-tests harness, and the site locks.
#
# release.yml only builds and packages — without this gate a type error or a
# broken provider parser could ship in a tagged release. The site tests also
# run in site-deploy.yml, but that workflow is path-filtered to `site/**`:
# src-only pushes — exactly the ones that stale the demo bundle — never
# reach it, so they are gated here unconditionally.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual dispatch lets a release session pre-flight the exact working tree
  # on a probe branch (git stash create -> push that SHA -> gh workflow run
  # --ref ci-probe) while it is still splitting commits, so environment-only
  # test failures surface before main is pushed. See temp/wrapup-070 for the
  # 0.7.0 post-mortem this was added for.
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc --noEmit + vite build (the same command the release uses).
      - run: pnpm run build

  # The harness compiles the real src-tauri sources via #[path] against a
  # Tauri stub; it is developed and verified on Windows, which is also the
  # target platform, so the gate runs there rather than on Linux.
  parse-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: parse-tests
      - run: cargo test
        working-directory: parse-tests

  # Zero-dependency invariant locks: i18n pairing, asset existence, demo
  # provenance hashes, hero numbers. No npm install — they only read tracked
  # files, which is what makes them cheap enough for every push and PR.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test site/*.test.mjs
