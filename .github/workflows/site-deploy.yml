name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site-deploy.yml"]
  pull_request:
    paths: ["site/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test site/*.test.mjs

  # vars.SITE_DEPLOY is the off switch: merging to main never deploys until
  # the Cloudflare secrets exist and the variable is set to 'true'.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx wrangler deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
