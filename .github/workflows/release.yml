# Pushing a v* tag builds installers on GitHub runners from that exact
# source. Manual runs (workflow_dispatch) upload artifacts without creating
# a release, for dry-run verification.
#
# Matrix: Windows NSIS (supported), macOS dmg and Linux AppImage/deb
# (first published binaries — tray UX is still Windows-shaped).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: macos-latest
            bundles: dmg
            artifact: macos
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08 (still installs latest stable Rust)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      # Updater artifacts are signed with this project's own minisign key
      # (TAURI_SIGNING_PRIVATE_KEY repo secret, no password; the matching
      # pubkey is embedded in tauri.conf.json).
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle -type f \( \
            -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
            -o -name '*.sig' -o -name '*.app.tar.gz' \
          \) -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts
          test -n "$(ls -A dist-artifacts)"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pane-${{ matrix.artifact }}
          path: dist-artifacts/*

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            tag="v$ver"
          fi
          if [[ "$tag" != "v$ver" ]]; then
            echo "Tag '$tag' does not match tauri.conf.json version 'v$ver' — bump the version before tagging." >&2
            exit 1
          fi

          win=$(find artifacts -name '*-setup.exe' -print -quit)
          mac=$(find artifacts -name '*.dmg' -print -quit)
          macup=$(find artifacts -name '*.app.tar.gz' -print -quit)
          appimage=$(find artifacts -name '*.AppImage' -print -quit)
          deb=$(find artifacts -name '*.deb' -print -quit)
          if [[ -z "$win" ]]; then
            echo "Windows NSIS installer missing; refusing to publish." >&2
            exit 1
          fi
          # Signed updater artifacts are mandatory: an empty signature makes
          # every client reject the update silently.
          for f in "$win" ${macup:+"$macup"} ${appimage:+"$appimage"}; do
            if [[ ! -s "$f.sig" ]]; then
              echo "Missing updater signature '$f.sig' — is TAURI_SIGNING_PRIVATE_KEY set?" >&2
              exit 1
            fi
          done

          sha256() { sha256sum "$1" | awk '{print $1}'; }
          win_hash=$(sha256 "$win")
          notes="https://github.com/Aafff623/pane/blob/main/CHANGELOG.md"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 - "$ver" "$tag" "$notes" "$pub_date" "$win" "$win_hash" "${mac:-}" "${macup:-}" "${appimage:-}" <<'PY'
          import json, os, sys
          ver, tag, notes, pub_date, win, win_hash, mac, macup, appimage = sys.argv[1:]
          base = f"https://github.com/Aafff623/pane/releases/download/{tag}"
          def sig(path):
              with open(path + ".sig", encoding="utf-8") as f:
                  return f.read().strip()
          platforms = {
              "windows-x86_64": {"signature": sig(win), "url": f"{base}/{os.path.basename(win)}"}
          }
          # The macOS updater consumes the .app.tar.gz, not the dmg.
          if macup:
              platforms["darwin-aarch64"] = {"signature": sig(macup), "url": f"{base}/{os.path.basename(macup)}"}
          if appimage:
              platforms["linux-x86_64"] = {"signature": sig(appimage), "url": f"{base}/{os.path.basename(appimage)}"}
          manifest = {
              "version": ver,
              "notes": notes,
              "pub_date": pub_date,
              "sha256": win_hash,
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(open("latest.json", encoding="utf-8").read())
          PY
          ls -la artifacts latest.json

      - name: Compose release notes
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="${GITHUB_REF_NAME:-}"
          [[ "${GITHUB_REF:-}" == refs/tags/* ]] || tag="v$ver"
          repo="${GITHUB_REPOSITORY:-Aafff623/pane}"
          python3 - "$ver" "$tag" "$repo" <<'PY'
          import os, re, sys
          ver, tag, repo = sys.argv[1:]

          # CHANGELOG.md is the single source of content. A missing or empty
          # section for this version means the changelog was never reconciled —
          # refuse to publish rather than emit an empty release body.
          # Section boundary: the next VERSION heading only (`## 0.4.70`,
          # `## Unreleased`) — the section's own `## 新增/变更/修复` subheads
          # must stay inside the body.
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(
              rf"^## {re.escape(ver)}(?!\d).*?$(.*?)(?=^## (?:\d|Unreleased)|\Z)",
              changelog, re.M | re.S,
          )
          if not m:
              sys.exit(f"CHANGELOG.md has no section for {ver} — reconcile it before tagging")
          section = m.group(1).strip()
          if not section:
              sys.exit(f"CHANGELOG.md section for {ver} is empty — reconcile it before tagging")

          # First plain text line before any list item (not a heading/quote/
          # indented continuation) becomes the one-line theme headline;
          # list-only sections stay on a bare version. The headline line is
          # dropped from the body — it already lives in the # title.
          headline = ""
          headline_raw = None
          for line in section.splitlines():
              s = line.strip()
              if not s or s.startswith("- "):
                  break
              if s.startswith(("#", ">")) or line[:1] in (" ", "\t"):
                  continue
              headline = s
              headline_raw = line
              break
          if headline_raw is not None:
              section = "\n".join(
                  l for l in section.splitlines() if l != headline_raw
              ).strip()

          def mb(path):
              return f"{os.path.getsize(path) / 1048576:.1f} MB"

          def arch_of(name):
              n = name.lower()
              if "aarch64" in n or "arm64" in n:
                  return "arm64"
              return "x86_64"

          # Pane bundles are already named Pane_<ver>_<os-arch>.<ext>, so the
          # architecture comes straight from the filename.
          BASE = f"https://github.com/{repo}/releases/download/{tag}"
          cells = {"Windows": {}, "macOS": {}, "Linux": {}}
          for f in sorted(os.listdir("artifacts")):
              if not os.path.isfile(os.path.join("artifacts", f)):
                  continue
              if f.endswith("-setup.exe"):
                  cells["Windows"]["x86_64"] = f"[exe]({BASE}/{f}) ({mb('artifacts/' + f)})"
              elif f.endswith(".dmg"):
                  cells["macOS"][arch_of(f)] = f"[dmg]({BASE}/{f}) ({mb('artifacts/' + f)})"
              elif f.endswith((".deb", ".rpm", ".AppImage")):
                  fmt = "AppImage" if f.endswith(".AppImage") else f.rsplit(".", 1)[1]
                  cells["Linux"].setdefault(arch_of(f), {})[fmt] = \
                      f"[{fmt}]({BASE}/{f}) ({mb('artifacts/' + f)})"
          # Package managers first, portable last: deb → rpm → AppImage.
          for arch, row in cells["Linux"].items():
              cells["Linux"][arch] = "<br>".join(row[k] for k in ("deb", "rpm", "AppImage") if k in row)

          def cell(row, arch):
              return row.get(arch, "—")

          title = f"Pane {tag}" + (f" — {headline}" if headline else "")
          table = (
              "| 系统 \\ 架构 | x86_64 (amd64) | arm64 (aarch64) |\n"
              "| --- | --- | --- |\n"
              f"| Windows | {cell(cells['Windows'], 'x86_64')} | {cell(cells['Windows'], 'arm64')} |\n"
              f"| macOS | {cell(cells['macOS'], 'x86_64')} | {cell(cells['macOS'], 'arm64')} |\n"
              f"| Linux | {cell(cells['Linux'], 'x86_64')} | {cell(cells['Linux'], 'arm64')} |"
          )
          with open("notes.md", "w", encoding="utf-8") as f:
              f.write(f"# {title}\n\n{table}\n\n{section}\n")
          print(open("notes.md", encoding="utf-8").read())
          PY
          ls -la notes.md

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pane-release-bundle
          path: |
            artifacts/*
            latest.json
            notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/* latest.json)
          gh release create "$GITHUB_REF_NAME" \
            --title "Pane ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            "${files[@]}"

      - name: Dispatch winget publish
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run winget.yml -f tag=$GITHUB_REF_NAME
