# Pushing a v* tag builds installers on GitHub runners from that exact
# source. Manual runs (workflow_dispatch) upload artifacts without creating
# a release, for dry-run verification.
#
# Matrix: Windows NSIS (supported), macOS dmg and Linux AppImage/deb
# (first published binaries — tray UX is still Windows-shaped).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows
          - os: macos-latest
            bundles: dmg
            artifact: macos
          - os: ubuntu-22.04
            bundles: appimage,deb
            artifact: linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08 (still installs latest stable Rust)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend deps
        run: npm ci

      # This repo has no minisign private key (the updater pubkey embedded
      # in tauri.conf.json belongs to the original upstream), so updater
      # artifacts cannot be signed here. Write the override to a file:
      # inline JSON on Windows npm loses its double quotes.
      - name: Write unsigned-bundle override
        shell: bash
        run: printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > build-config.json

      - name: Build
        run: npm run tauri build -- --config build-config.json --bundles ${{ matrix.bundles }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          find src-tauri/target/release/bundle -type f \( \
            -name '*-setup.exe' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \
          \) -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts
          test -n "$(ls -A dist-artifacts)"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pane-${{ matrix.artifact }}
          path: dist-artifacts/*

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          ver=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" != refs/tags/* ]]; then
            tag="v$ver"
          fi
          if [[ "$tag" != "v$ver" ]]; then
            echo "Tag '$tag' does not match tauri.conf.json version 'v$ver' — bump the version before tagging." >&2
            exit 1
          fi

          win=$(find artifacts -name '*-setup.exe' -print -quit)
          mac=$(find artifacts -name '*.dmg' -print -quit)
          appimage=$(find artifacts -name '*.AppImage' -print -quit)
          deb=$(find artifacts -name '*.deb' -print -quit)
          if [[ -z "$win" ]]; then
            echo "Windows NSIS installer missing; refusing to publish." >&2
            exit 1
          fi

          sha256() { sha256sum "$1" | awk '{print $1}'; }
          win_hash=$(sha256 "$win")
          notes="https://github.com/Aafff623/pane/blob/main/CHANGELOG.md"
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          python3 - "$ver" "$tag" "$notes" "$pub_date" "$win" "$win_hash" "${mac:-}" "${appimage:-}" <<'PY'
          import json, os, sys
          ver, tag, notes, pub_date, win, win_hash, mac, appimage = sys.argv[1:]
          base = f"https://github.com/Aafff623/pane/releases/download/{tag}"
          platforms = {
              "windows-x86_64": {"signature": "", "url": f"{base}/{os.path.basename(win)}"}
          }
          if mac:
              platforms["darwin-aarch64"] = {"signature": "", "url": f"{base}/{os.path.basename(mac)}"}
          if appimage:
              platforms["linux-x86_64"] = {"signature": "", "url": f"{base}/{os.path.basename(appimage)}"}
          manifest = {
              "version": ver,
              "notes": notes,
              "pub_date": pub_date,
              "sha256": win_hash,
              "platforms": platforms,
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(open("latest.json", encoding="utf-8").read())
          PY
          ls -la artifacts latest.json

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pane-release-bundle
          path: |
            artifacts/*
            latest.json

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(artifacts/* latest.json)
          gh release create "$GITHUB_REF_NAME" \
            --title "Pane ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${files[@]}"

      - name: Dispatch winget publish
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run winget.yml -f tag=$GITHUB_REF_NAME
