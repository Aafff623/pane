# Release pipeline: pushing a v* tag builds the installer on GitHub's own
# runners from that exact source — public logs prove the binary matches
# the code. Manual runs (workflow_dispatch) build and upload artifacts
# without creating a release, for dry-run verification.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      # The winget dispatch step creates a workflow_dispatch event, which
      # needs actions: write — a permissions block nulls every unlisted
      # scope, so without this the dispatch 403s (and continue-on-error
      # would hide it, silently reproducing the never-publishes bug).
      actions: write
    # Third-party actions are pinned to commit SHAs: a moving tag like @v4
    # lets whoever controls that repo swap in new code that runs inside
    # this signing pipeline. The trailing comment names the tag the SHA
    # was taken from; bump by updating both together.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08 (still installs latest stable Rust)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # This repo has no minisign private key (the updater pubkey embedded
      # in tauri.conf.json belongs to the original upstream), so updater
      # artifacts cannot be signed here — building with them enabled fails
      # at the signing step. Ship plain installers + a sha256 manifest
      # until this repo gets its own keypair and endpoints.
      - name: Build
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Generate latest.json (with sha256 — install.ps1 requires it)
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          # The release is created under the git tag, so the download URL
          # must use the tag too. A tag that disagrees with the config
          # version is always a mistake — fail loudly instead of shipping
          # an updater manifest that would 404.
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { "v$ver" }
          if ($tag -ne "v$ver") {
            Write-Error "Tag '$tag' does not match tauri.conf.json version 'v$ver' — bump the version before tagging."
            exit 1
          }
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          # No signing key in this repo: the signature field stays empty
          # (sha256 below is what install.ps1 actually consumes).
          $sig = ""
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          $manifest = @{
            version  = $ver
            notes    = "https://github.com/Aafff623/pane/blob/main/CHANGELOG.md"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            sha256   = $hash
            platforms = @{ "windows-x86_64" = @{
              signature = $sig
              url = "https://github.com/Aafff623/pane/releases/download/$tag/$($exe.Name)"
            } }
          } | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText("latest.json", $manifest, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content latest.json

      - name: Upload artifacts (dry run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pane-installer
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            latest.json

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME `
            --title "Pane $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --generate-notes `
            $exe.FullName latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Releases created with GITHUB_TOKEN emit no workflow-triggering
      # `release` event, so hand the baton to the winget workflow
      # explicitly (workflow_dispatch is exempt from that rule).
      # Non-fatal: a failed dispatch must not fail a shipped release.
      - name: Dispatch winget publish
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        shell: pwsh
        run: gh workflow run winget.yml -f tag=$env:GITHUB_REF_NAME
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
