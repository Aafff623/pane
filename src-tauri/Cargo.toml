[package]
name = "pane"
version = "0.4.60"
description = "AI subscription usage in the Windows tray"
authors = ["jazii"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pane_lib"
crate-type = ["rlib"]

[features]
default = []
# Used only by parse-tests so it can compile platform/windows.rs against
# the Tauri stub without pulling WebView2 COM.
harness = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
tiny_http = "0.12"
arboard = "3"
tokio = { version = "1", features = ["macros", "process", "sync", "time"] }
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
# Qoder CN (Chromium os_crypt AES-256-GCM) and Trae CN (ByteCrypto
# AES-128-CBC) credential files; pure Rust, no system backend.
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
toml = "0.8"
regex = "1"
prost = "0.13" # Grok GetRemainingResets protobuf codec

# Win32 is reached only through src/platform/windows.rs. Keeping these
# target-scoped is what lets the crate compile at all on Linux and macOS —
# an unconditional `windows` dependency fails to build off-Windows.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
